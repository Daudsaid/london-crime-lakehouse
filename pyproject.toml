[project]
name = "uk-crime-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=4.4.1",
    "pyspark>=4.2.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uk_crime"
