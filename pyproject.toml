[project]
name = "uk-crime-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=4.4.1",
    "pyspark>=4.2.0",
    "requests>=2.34.2",
]

[dependency-groups]
dashboard = [
    "pandas<3",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uk_crime"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that run a whole layer and write real Delta tables (deselect with -m 'not slow')",
]
