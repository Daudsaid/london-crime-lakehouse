version: 2

updates:
  # Workflow actions (including the setup-uv release tag pinned in ci.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies in pyproject.toml / uv.lock.
  - package-ecosystem: uv
    directory: /
    # Only update uv.lock; never edit the constraints in pyproject.toml (e.g. the pandas<3 pin).
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
